aid: notarize
name: Notarize
description: >-
  Notarize (rebranded as Proof) provides Remote Online Notarization (RON), eSignature,
  identity verification, and reusable digital credentials through the Notarize Network.
  Its REST API (api.proof.com) lets businesses create notarization, eSign, Identify, and
  real-estate/mortgage closing transactions, attach and template documents, invite signers,
  manage notaries, and receive V2 webhooks for every transaction and notary state change.
  Authentication is by API key or OAuth 2.0 client credentials, with a Fairfax test
  environment for end-to-end sandbox testing. Widely used across proptech, lending, title,
  and legal workflows.
