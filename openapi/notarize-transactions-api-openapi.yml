components:
  schemas:
    attachment:
      type: object
      properties:
        date_created:
          type: string
          maxLength: 100
          description: Date Attachment was created/uploaded.
        name:
          type: string
          maxLength: 5000
          description: Name of the attachment
        url:
          type: string
          maxLength: 5000
          description: URL of the attachment
    proof_requirement_multi_factor_authentication:
      type: object
      properties:
        type:
          type: string
          enum:
          - sms
          description: Signer enters authentication code sent to their mobile phone.
      required:
      - type
    notary_instructions:
      type: object
      properties:
        notary_note:
          type: string
          maxLength: 500
          description: 500 character limit.
    notary_objects:
      type: array
      items:
        $ref: '#/components/schemas/notary_object'
    notarization_record_signer_object:
      type: object
      properties:
        signer_id:
          type:
          - string
          - 'null'
          maxLength: 38
          description: Signer ID
        email:
          type: string
          maxLength: 100
          description: Email
        first_name:
          type: string
          maxLength: 30
          description: First name
        middle_name:
          type:
          - string
          - 'null'
          maxLength: 30
          description: Middle name
        last_name:
          type: string
          maxLength: 30
          description: Last name
        address:
          $ref: '#/components/schemas/address'
          description: The most recent known address for the signer.
        dob:
          type: string
          maxLength: 30
          description: The signer's date of birth.
    credential_image:
      type: object
      properties:
        url:
          type: string
          maxLength: 5000
          description: URL of the image
        descriptor:
          type: string
          enum:
          - back
          - front
    verify_tool_requirement:
      type: object
      properties:
        requirement:
          type: string
          enum:
          - run
          - pass
          - none
          description: Setting indicating whether or not the verify tool will be required to run or pass, or both
        available:
          type: boolean
          description: Whether this verify tool is available for the transaction.
      required:
      - requirement
    openid_connect_transaction_object:
      type: object
      properties:
        transaction_id:
          type: string
          description: The resulting transaction ID for the created transaction
        access_link:
          type: string
          description: The generated access link to send a user to for verification
    photo_identification:
      type: object
      properties:
        primary_front:
          type: string
          maxLength: 5000
          description: URL of the front of the primary photo identification document.
        primary_back:
          type: string
          maxLength: 5000
          description: URL of the back of the primary photo identification document.
        primary_type:
          type: string
          maxLength: 5000
          description: Type of the primary photo identification document.
        primary_issuer:
          type: string
          maxLength: 5000
          description: Issuer of the primary photo identification document.
        primary_expiry_date:
          type: string
          maxLength: 100
          description: Expiry date of the primary photo identification document.
        secondary_front:
          type: string
          maxLength: 5000
          description: URL of the front of the secondary photo identification document.
    witness:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        address:
          $ref: '#/components/schemas/address'
        credential_assets:
          type: array
          items:
            $ref: '#/components/schemas/credential_asset_object'
    expiry:
      type: string
      maxLength: 100
      description: An ISO-8601 formatted DateTime String, optionally including the timezone offset. If timezone offset is not provided, the account’s default timezone settings will be applied. This param sets time after which the signer is NOT permitted to complete the transaction. If a signer attempts to complete the transaction after this time is reached, they will receive an error. Expiration time is optional, and no default is set if this parameter is left blank. Any transaction that expires is no longer editable, and a new transaction must be created.
    recipient_group:
      type: object
      properties:
        shared_inbox_email:
          type: string
          maxLength: 5000
          description: The email address that is shared by a group.  Whomever has access to this email address can claim the transaction for themself.
    document:
      type: object
      properties:
        id:
          type: string
          maxLength: 5000
        allowed_actions:
          type: array
          items:
            type: string
            maxLength: 5000
          description: List of allowed actions on document.
        bundle_position:
          type: integer
          description: Position to put document in bundle
        completion_state:
          type: string
          maxLength: 5000
        data:
          type:
          - string
          - 'null'
          description: base64 encoded document. Present if base64 encoding was specified in request. Currently supported for get_document only.
        date_created:
          type: string
          maxLength: 100
          description: Date document was created/uploaded.
        date_updated:
          type: string
          maxLength: 100
          description: Date document was last updated.
        document_name:
          type: string
          maxLength: 5000
          description: Name of document.
        esign_required:
          type: boolean
          description: Boolean flag indicating whether the document requires esigning.
        final_document_url:
          type:
          - string
          - 'null'
          maxLength: 5000
        identification_reviewed:
          type: boolean
        identity_confirmation_required:
          type: boolean
          description: Boolean flag indicating whether the document requires identity confirmation.
        is_enote:
          type:
          - boolean
          - 'null'
          description: Boolean flag indicating whether the document is an eNote.
        notarization_required:
          type: boolean
          description: Boolean flag indicating whether the document requires notarization. If `true`, identity_confirmation_required must be `false`. If `false`, the document may still be e-signed in the notary meeting. At least one document in a transaction must require notarization or identity confirmation.
        permissions:
          type: array
          items:
            type: string
            maxLength: 5000
          description: List of allowed actions on document.
        processing_error:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: Error message if document processing failed.
        processing_state:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: State of document processing.
        rejection_anecdote:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: Anecdote for document rejection.
        rejection_reason:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: Reason for document rejection.
        requirement:
          type: string
          maxLength: 5000
          description: 'Completion requirement for the document. Accepted values can be `notarization`, `esign`, `identity_confirmation` **([identity confirmation feature](https://dev.proof.com/docs/enterprise-features))**, `readonly`, and `non_essential`. Completion requirement for the document.  If the value is set to `non_essential`, the document will be hidden from signers before the notary meeting and values for  `customer_can_annotate` and `witness_required` will be ignored and set to false. `identity_confirmation` is used to support signing of PS Form 1583 for signers without a US SSN. Note: if `identity_confirmation` is set as the document requirement, ensure that all documents requiring notarization in the transaction also use `identity confirmation` as the requirement to avoid requiring KBA on the transaction. [Read more](https://dev.proof.com/docs/document-requirements) about document requirements.'
        signed_url:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: Signed URL for the final document PDF.
        signing_designation_groups:
          type: array
          items:
            $ref: '#/components/schemas/signing_designation_group'
          description: This array contains a prescribed list of groups of designations for signers and/or a notary to annotate the document.
        signing_designations:
          type: array
          items:
            $ref: '#/components/schemas/signing_designation'
          description: This array contains a prescribed list of designations for signers and/or a notary to annotate the document.
        signing_type:
          type: string
          enum:
          - NOTARIZATION
          - ESIGN
        tracking_id:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: The external tracking ID of the document.
        vaulted:
          type: boolean
          description: Boolean flag indicating whether the document is vaulted.
    signers:
      type: object
      properties:
        signer_id:
          type: string
          maxLength: 30
          description: Signer ID
        email:
          type: string
          maxLength: 5000
          description: Email is required unless you provide a recipient_group object.
        first_name:
          type: string
          maxLength: 30
          description: First name
        middle_name:
          type:
          - string
          - 'null'
          maxLength: 30
          description: Middle name
        last_name:
          type: string
          maxLength: 30
          description: Last name
        phone_number:
          type: string
          maxLength: 30
          description: Signer phone number. A country code can be defined by using the `+` symbol. For example, `+11234567890` will set the country code to `+1` for the number `1234567890`. If no country code is specified the default will be the United States country code of `+1`.
        phone:
          type:
          - object
          - 'null'
          properties:
            country_code:
              type: string
              maxLength: 10
              description: The country code for the phone number, e.g. 1
            number:
              type: string
              maxLength: 20
              description: The phone number without the country code, e.g. 5551234567
        address:
          $ref: '#/components/schemas/address'
          description: The most recent known address for the signer.
        dob:
          type: string
          maxLength: 30
          description: The signer's date of birth.
        capacity:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: The signers capacity when signing on behalf of an entity, required when entity is present
        entity:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: Entity the signer is signing on behalf of, required when capacity is present
        external_id:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: A string representing an ID external to Proof's systems. Use this to associate a signer to an ID that your systems understand, such as a User ID.
        link_expired:
          type: boolean
          description: Indicates if the signer's passwordless link has expired.
        personally_known_to_notary:
          type: boolean
          description: If the signer is personally known to the notary. This can currently only be used on single signer transactions, or when the notary_id is specified on the signer.
        proof_requirement:
          $ref: '#/components/schemas/proof_requirement'
          description: Add enhanced checks to validate a signer's identity to create a Proof transaction. Reach out to your customer success team to enable if not yet available.
        recipient_group:
          $ref: '#/components/schemas/recipient_group'
          description: Use this to send to a group that will be able to claim the transaction. This would be used in place of email and name properties.
        sdk_token:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: Equivalent to transaction_access_link; prefer using that instead.
        signatory_capacities:
          type: array
          items:
            type: object
            properties:
              capacity:
                type: string
              type:
                type: string
                enum:
                - attorney_in_fact
                - corporate_officer
                - guardian_or_conservator
                - general_partner
                - limited_partner
                - trustee
                - other
              representative_of:
                type: string
          description: An array of signatory capacities for the signer when signing on behalf of multiple entities.
        primary_id_allow_list_by_country:
          $ref: '#/components/schemas/id_allow_list_by_country'
        secondary_id_allow_list_by_country:
          $ref: '#/components/schemas/id_allow_list_by_country'
        signing_requirement:
          type:
          - string
          - 'null'
          enum:
          - esign
          - identify
          - verify
          - screen
          description: Override the document signing requirement for an individual signer.
        signing_status:
          type:
          - string
          - 'null'
          enum:
          - incomplete
          - in_progress
          - complete
        transaction_access_link:
          type: string
          description: A link to the transaction for this signer.
        vesting_type:
          type: string
          enum:
          - borrower
          - non_borrower
          description: Can be either `borrower` or `non_borrower`. Defaults to `borrower`.
        skip_landing_page:
          type:
          - boolean
          - 'null'
          description: If true, skip the landing page the user will see before beginning verification
        credential_assets:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/credential_asset_object'
        esign_authentication_records:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/photo_validation_attempt'
        order:
          type:
          - integer
          - 'null'
          description: Order the signers will sign in. Should be positive numbers starting with 1. Setting to the same order as another signer indicates they will sign at the same time.
        notary_id:
          type:
          - string
          - 'null'
          maxLength: 100
          description: User ID ("us_xxxxxxx") of the assigned Notary or "notarize". Eligible notaries must be a notary who is a member of your organization. Order must be utilized with this field, all notarization signers with the same order must have the same notary_id.
        suppress_communications:
          type:
          - string
          - 'null'
          enum:
          - all
          description: Suppress Proof communications to this signer. Only "all" is currently supported.
        verify_tool_configuration:
          $ref: '#/components/schemas/verify_tool_configuration'
          description: Signer verify tool configuration for transactions with a verify signing requirement.
    verify_tool_configuration:
      type: object
      properties:
        credit_card_config:
          $ref: '#/components/schemas/verify_tool_requirement'
        selfie_config:
          $ref: '#/components/schemas/verify_tool_requirement'
        credential_analysis_config:
          $ref: '#/components/schemas/verify_tool_requirement'
    openid_connect_transaction_workflow:
      type: object
      properties:
        id:
          type: string
          enum:
          - proof.kba.default
          - proof.ca.default
          - proof.ial2.default
        parameters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/openid_connect_transaction_request_parameter'
        options:
          $ref: '#/components/schemas/openid_connect_transaction_options'
    redirect:
      type: object
      properties:
        url:
          type: string
          maxLength: 5000
          description: Valid url to redirect the user to once the meeting is complete
        message:
          type: string
          maxLength: 5000
          description: The message to show the user when the redirect is shown
    errors_object:
      type: object
      properties:
        message:
          type: string
          maxLength: 5000
          description: Deprecated; prefer using the errors array instead
        errors:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          - type: object
    transaction_create_params:
      type: object
      properties:
        activation_time:
          type: string
          maxLength: 100
          description: An ISO-8601 formatted DateTime String, optionally including a timezone offset. If timezone offset is not provided, the Proof account’s default timezone settings will be applied. This param sets the time after which the signer is permitted to connect with a notary to complete the transaction. If a signer attempts to connect with a notary before this time is reached, the signer will be only permitted to review documents.
        allowed_notary_states:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 2
          description: A non-empty array of 2-letter US state abbreviations, e.g. ["VA","TX"]. Restricts the transaction to notaries commissioned in the given states. Must be enabled for your organization. Can be changed or removed later via transaction update.
        signer:
          $ref: '#/components/schemas/signer'
        signers:
          type: array
          items:
            $ref: '#/components/schemas/signers'
          description: An array of signer objects each with at minimum the email field set (limit 10 signers per transaction). The request to notarize the document will be sent to that email address.
        cosigner:
          $ref: '#/components/schemas/cosigner'
        draft:
          type: boolean
          description: When set to true, the transaction will be created in a Draft state. This attribute is typically used when managing multi-document transactions. When the transaction is in draft state, transaction attributes can be modified and additional documents can be added to the bundle, using the documents API. To activate the transaction, the notarization_ready API endpoint must be called.
        expiry:
          $ref: '#/components/schemas/expiry'
        payer:
          type: string
          enum:
          - signer
          - sender
          description: Possible values are `signer` or `sender`. If no value is supplied then the payer will be based on the api key's payer setting.
        external_id:
          type: string
          maxLength: 5000
          description: A string representing an ID external to Proof's systems. Use this to associate a transaction to an ID that your systems understand, such as an Order ID or system GUID.
        transaction_name:
          type: string
          maxLength: 5000
          description: Short, human-readable name for the transaction - eg. Miguel's TPS notarization for Leeroy. Defaults to Untitled Transaction.
        message_to_signer:
          type: string
          maxLength: 30000
          description: Message to signer using GitHub Flavored Markdown. Html, images, links, and code are stripped out. Can be used to provide instructions, thank customers, add additional context to the transaction, or simply to add a personal touch. The message will be added to the email sent to the signer. (30,000 character limit)
        transaction_type:
          type: string
          maxLength: 5000
          description: Short, human-readable description of the transaction. Can be used to categorize transactions by their purpose or by general type — e.g. `Account Opening` or `Power of Attorney`.
        message_subject:
          type: string
          maxLength: 30000
          description: Subject line of email to signer.
        message_signature:
          type: string
          maxLength: 30000
          description: Signature in email to signer.
        pdf_bookmarked:
          type: boolean
          description: Split the document by bookmarks if it is a pdf
        require_secondary_photo_id:
          type: boolean
          description: Certain businesses and transaction types may need signers to provide two forms of photo identification. This feature enables you to require two forms on a transaction. If true, the signer cannot proceed to the notary meeting without first providing two forms of photo ID during the Proof identity verification process. If false (default), the signer can proceed to notary meeting after providing one form of photo ID.
        suppress_email:
          type: boolean
          description: If sent as true during activation, Proof will not send a notification email to the signer when the transaction is activated. If you use this feature, you are responsible for providing the signer with the `transaction_access_link`. This value is not stored on the transaction and must be provided anytime the transaction is activated.
        authentication_requirement:
          type: string
          enum:
          - sms
          - none
          description: Additional authentication requirement for signers on the transaction. If SMS, a phone number must be provided for each signer.
        require_new_signer_verification:
          type: boolean
          description: When set to false, Proof will not require a new signer to verify their email address before moving into the transaction flow.
        notary_instructions:
          type: array
          items:
            $ref: '#/components/schemas/notary_instructions'
          description: Instructions for the Notarize Network notary.
        redirect:
          $ref: '#/components/schemas/redirect'
        notary_id:
          type: string
          maxLength: 5000
          description: User ID ("us_xxxxxxx") of the assigned Notary. Eligible notaries must be either a connected BYOT notary, or a BYON notary who is a member of your organization. Notary assignment is not a strict requirement. When this parameter is specified, the notary will be sent an SMS that the signer is about to enter the waiting room, but the notary can take any signer in the queue, and any available notary can take the signer.
        notary_meeting_time:
          type: string
          maxLength: 100
          format: date-time
          description: An ISO-8061 formatted DateTime String, optionally including the timezone offset. Meeting time will be shown to signer in default emails. Proof will not prevent the signer or notary from starting the meeting at any other time.
        organization_id:
          type: string
          maxLength: 5000
          description: The organization id of a child account. If the authenticated account has child accounts, specifying this parameter will create the transaction in the provided child org.
        document_url_version:
          type: string
          description: Optional param to test v2 document urls.
          enum:
          - v1
          - v2
        documents:
          type: array
          items:
            type: string
            maxLength: 70000000
          description: Documents to be signed or notarized. Accepted as an array of document objects or simple document["resource"] field values. Maximum size of an individual document is 50MB, or approximately 70M characters encoded in base64.
        document:
          type: string
          maxLength: 70000000
          description: Documents to be signed or notarized. Accepted as an array of document objects or simple document["resource"] field values. Maximum size of an individual document is 50MB, or approximately 70M characters encoded in base64.
        cc_recipient_emails:
          type: array
