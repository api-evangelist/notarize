          type: array
          items:
            $ref: '#/components/schemas/notary_instructions'
        notary_id:
          type: string
          maxLength: 5000
          description: "User ID (\"us_xxxxxxx\") of the assigned Notary.\nEligible notaries must be either a connected BYOT notary, or a BYON notary who is a member of your organization.\nNotary assignment is not a strict requirement. When this parameter is specified, the notary will be sent an SMS that the signer is about to enter the waiting room,\n but the notary can take any signer in the queue, and any available notary can take the signer."
