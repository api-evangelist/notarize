        activation_time:
          type: string
          maxLength: 100
          description: An ISO-8601 formatted DateTime String, optionally including a timezone offset. If timezone offset is not provided, the Proof account’s default timezone settings will be applied. This param sets the time after which the signer is permitted to connect with a notary to complete the transaction. If a signer attempts to connect with a notary before this time is reached, the signer will be only permitted to review documents.
        allowed_notary_states:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 2
          description: A non-empty array of 2-letter US state abbreviations, e.g. ["VA","TX"]. Restricts the transaction to notaries commissioned in the given states. Must be enabled for your organization. Can be changed or removed later via transaction update.
        file_number:
          type: string
          maxLength: 5000
          description: Unique value used to map transactions to a title agency’s records and systems. Including this value helps streamline communications with the title company who is supporting the transaction.
        loan_number:
          type: string
          maxLength: 5000
          description: Unique value used to map transactions to your own records and systems. Providing loan_number as part of a create transaction request ensures it is visible to all users to manage the transaction.
        paper_note_consent:
          type: boolean
          description: Allows a lender to create a hybrid transaction and bypass the eNote requirement.
        signer:
          $ref: '#/components/schemas/signer_2'
        signers:
          type: array
          items:
            $ref: '#/components/schemas/signers_2'
          description: An array of signer objects each with at minimum the email field set (limit 10 signers per transaction). The request to notarize the document will be sent to that email address.
        cosigner:
          $ref: '#/components/schemas/cosigner'
        recording_jurisdiction_id:
          type: string
          maxLength: 5000
          description: 'RECOMMENDED: The id of the recording jurisdiction the property address is within. If this is not provided we will attempt to find the jurisdiction based on the provided street_address.'
        title_agency_id:
          type: string
          maxLength: 5000
          description: Required for Lenders. The id of the title agency participating on the transaction. Returned in the /verify_address call. If title_agency_id is empty, contact with role of title_agent is required.
        draft:
          type: boolean
          description: When set to true, the transaction will be created in a Draft state. This attribute is typically used when managing multi-document transactions. When the transaction is in draft state, transaction attributes can be modified and additional documents can be added to the bundle, using the documents API. To activate the transaction, the notarization_ready API endpoint must be called.
        expiration_time:
          type: string
          maxLength: 100
          description: An ISO-8601 formatted DateTime String, optionally including the timezone offset. If timezone offset is not provided, the account’s default timezone settings will be applied. This param sets time after which the signer is NOT permitted to connect with a notary to complete the transaction. If a signer attempts to complete the transaction after this time is reached, they will receive an error. Expiration time is optional, and no default is set if this parameter is left blank. Any transaction that expires is no longer editable, and a new transaction must be created.
        external_id:
          type: string
          maxLength: 5000
          description: A string representing an ID external to Proof's systems. Use this to associate a transaction to an ID that your systems understand, such as an Order ID or system GUID.
        transaction_name:
          type: string
          maxLength: 5000
          description: Short, human-readable name for the transaction - eg. Miguel's TPS notarization for Leeroy. Defaults to Untitled Transaction.
        title_underwriter_id:
          type: string
          maxLength: 5000
          description: The id of the title underwriter participating on the transaction. Returned in the /verify_address call.
        transaction_type:
          type: string
          enum:
