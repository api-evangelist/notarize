        contacts:
          type: array
          items:
            $ref: '#/components/schemas/contact'
        notary_meeting_time:
          type: string
          maxLength: 100
          format: date-time
          description: 'An ISO-8061 formatted DateTime String, optionally including the timezone offset.

            Meeting time will be shown to signer in default emails. Proof will not prevent the signer or notary from starting the meeting at any other time.'
        organization_id:
          type: string
          maxLength: 5000
          description: The organization id of a child account. If the authenticated account has child accounts, specifying this parameter will create the transaction in the provided child org.
        document_url_version:
          type: string
          description: Optional param to test v2 document urls.
          enum:
          - v1
          - v2
        documents:
          type: array
          items:
            $ref: '#/components/schemas/document_params'
          description: Documents to be signed or notarized. Accepted as an array of document objects or simple document["resource"] field values.
        document:
          $ref: '#/components/schemas/document_params'
          description: Documents to be signed or notarized. Accepted as an array of document objects or simple document["resource"] field values.
        jurisdiction_eligibility_consent:
          type: boolean
          description: When true, the transaction requires only a US state rather than a specific recording jurisdiction. Defaults to false.
        require_new_signer_verification:
          type: boolean
          description: When set to false, Proof will not require a new signer to verify their email address before moving into the transaction flow.
        skip_closing_ops:
