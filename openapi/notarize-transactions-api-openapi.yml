openapi: 3.2.0
info:
  title: Notarize Transactions API
  version: '1.0'
  description: 'Operations tagged Transactions across 2 of this provider''s published API definitions: notarize-proof-business-api-specification-openapi.yml, notarize-proof-real-estate-api-specification-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.proof.com
  description: Public API URL
tags:
- name: Transactions
paths:
  /v1/organizations/{organization_id}/transactions/identity:
    post:
      summary: Create OpenId Connect Transaction
      tags:
      - Transactions
      operationId: createOpenIdConnectTransaction
      security:
      - api_key: []
      parameters:
      - name: organization_id
        in: path
        description: ID of the organization creating the transaction.
        required: true
        x-example: or_od4q9nk
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                transaction_id: ot_6od49nk
                access_link: https://app.local.dev-notarize.com/activate-transaction?bundle_id=dbd9741eb2-f85f-460b-88b0-dc1ac0ced583&code=JEEHMFLSACJDCRKI&document_count=0&draft=false&email=single-use%2B0aa4e686-cd20-493f-a921-1874d7b8a8fa%40notarize.com&is_mortgage=false&organization_name=Schiller+and+Sons&requires_nsa_meeting=true&s_key=JEEHMFLSACJDCRKI&target=BUNDLE&transaction_id=ot6od49nk&user_id=usynxkydj
              schema:
                $ref: '#/components/schemas/openid_connect_transaction_object'
        '400':
          description: Invalid Parameter
          content:
            application/json:
              example:
                errors:
                - invalid_workflow
              schema:
                $ref: '#/components/schemas/errors_array'
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                errors:
                - invalid_organization
              schema:
                $ref: '#/components/schemas/errors_array'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openid_connect_transaction_create_params'
    servers:
    - url: https://api.proof.com
      description: Public API URL
  /v1/transactions:
    get:
      summary: List Transactions
      tags:
      - Transactions
      operationId: getAllTransactions
      security:
      - api_key: []
      parameters:
      - name: limit
        in: query
        required: false
        description: How many results to return. Default is 10; max is 1000.
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: 'Offset request by given # of items. Default is 0.'
        schema:
          type: integer
      - name: created_date_start
        in: query
        schema:
          type: string
          format: date-time
        required: false
        description: An ISO-8061 formatted DateTime String, optionally including the timezone offset. Will return all transactions created after this DateTime.
      - name: created_date_end
        in: query
        schema:
          type: string
          format: date-time
        required: false
        description: An ISO-8061 formatted DateTime String, optionally including the timezone offset. Will return all transactions created before this DateTime.
      - name: last_updated_date_start
        in: query
        schema:
          type: string
          format: date-time
        required: false
        description: An ISO-8061 formatted DateTime String, optionally including the timezone offset. Will return all transactions last updated after this DateTime.
      - name: last_updated_date_end
        in: query
        schema:
          type: string
          format: date-time
        required: false
        description: An ISO-8061 formatted DateTime String, optionally including the timezone offset. Will return all transactions last updated before this DateTime.
      - name: transaction_status
        in: query
        schema:
          type: string
          enum:
          - started
          - sent
          - received
          - completed
          - partially_completed
          - completed_with_rejections
          - active
          - sent_to_closing_ops
          - sent_to_title_agency
          - expired
        description: Return transactions based on their current transaction status.
        x-example: sent
      - name: document_url_version
        in: query
        schema:
          type: string
          enum:
          - v1
          - v2
          default: v1
        required: false
        description: Control documents and signer photo identifications download URLs. v1 for AWS S3 pre-signed URLs. v2 for Proof secure URLs.
      responses:
        '200':
          description: successful
