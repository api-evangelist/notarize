          - trailing_docs
          - purchase_seller
          - purchase_buyer_cash
          - purchase_buyer_loan
          - heloc
          - loan_mod_borrower
          - other
          - hybrid_refinance
          - hybrid_trailing_docs
          - hybrid_purchase_seller
          - hybrid_purchase_buyer_cash
          - hybrid_purchase_buyer_loan
          - hybrid_other
          - wet_sign
          - real_estate_esign
          - real_estate_proof
          description: 'Accepted values: refinance, trailing_docs, purchase_seller, purchase_buyer_cash, purchase_buyer_loan, heloc, loan_mod_borrower, other, hybrid_refinance, hybrid_trailing_docs, hybrid_purchase_seller, hybrid_purchase_buyer_cash, hybrid_purchase_buyer_loan, hybrid_other, wet_sign, real_estate_esign, real_estate_proof. The refinance and purchase_buyer_loan transaction types require an eNote. Hybrid transactions are notarized off of the Notarize Network platform. Wet sign transactions do not require a `signers` parameter and can only have a document requirement of `esign_supervised`.'
