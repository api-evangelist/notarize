openapi: 3.2.0
info:
  title: Notarize Documents API
  version: '1.0'
  description: 'Operations tagged Documents across 2 of this provider''s published API definitions: notarize-proof-business-api-specification-openapi.yml, notarize-proof-real-estate-api-specification-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.proof.com
  description: Public API URL
tags:
- name: Documents
paths:
  /v1/documents/{id}:
    put:
      summary: Update Documents
      tags:
      - Documents
      operationId: updateDocuments
      security:
      - api_key: []
      parameters:
      - name: id
        in: path
        description: ID of the document to update.
        required: true
        x-example: do_c98b5496-3465-4763-9479-4c0d35e6a0e4
        schema:
          type: string
      - name: document_url_version
        in: query
        schema:
          type: string
          enum:
          - v1
          - v2
          default: v1
        required: false
        description: Control documents and signer photo identifications download URLs. v1 for AWS S3 pre-signed URLs. v2 for Proof secure URLs.
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                id: do_c98b5496-3465-4763-9479-4c0d35e6a0e4
                allowed_actions:
                - CUSTOMER_CAN_ANNOTATE
                - WITNESS_REQUIRED
                - NOTARIZATION_REQUIRED
                bundle_position: 0
                completion_state: incomplete
                date_created: '2026-10-13T16:07:56.030890Z'
                date_updated: '2026-10-13T16:07:56.200885Z'
                document_name: new-name1
                esign_required: false
                identity_confirmation_required: false
                notarization_required: true
                processing_state: done
                requirement: notarization
                signing_designation_groups: []
                signing_designations: []
                tracking_id: tracking_id
                vaulted: false
              schema:
                $ref: '#/components/schemas/document'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                errors:
                - Invalid value for name - expected String
              schema:
                $ref: '#/components/schemas/errors_object'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/document_params'
    patch:
      summary: Update Documents
