openapi: 3.2.0
info:
  title: Notarize Organizations API
  version: '1.0'
  description: 'Operations tagged Organizations across 2 of this provider''s published API definitions: notarize-proof-business-api-specification-openapi.yml, notarize-proof-real-estate-api-specification-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.proof.com
  description: Public API URL
tags:
- name: Organizations
paths:
  /v1/organization:
    get:
      summary: Get Organization Information
      tags:
      - Organizations
      operationId: getOrganizationInformation
      security:
      - api_key: []
      responses:
        '200':
          description: success
          content:
            application/json:
              example:
                id: or_rn6a4dq
                name: Tillman, Koch and Mayert
                email: 559e5de5fb.osinski.raul@runte.test
                logo_s3_link: null
              schema:
                $ref: '#/components/schemas/organization_object'
    servers:
    - url: https://api.proof.com
      description: Public API URL
  /v1/partners:
    post:
      summary: Create Partner Organization
      tags:
      - Organizations
      operationId: createPartnerOrganization
      security:
      - api_key: []
      parameters: []
      responses:
        '200':
          description: success
          content:
            application/json:
              example:
                id: or_ynxkydj
                name: New Organization Name
                email: org_controller_spec@proof.com
                logo_s3_link: null
              schema:
                $ref: '#/components/schemas/organization_object'
        '400':
          description: bad request
          content:
            application/json:
              example:
                errors:
                - Invalid email format
              schema:
                $ref: '#/components/schemas/errors_object'
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                errors:
                - Feature Not Enabled
              schema:
                $ref: '#/components/schemas/errors_object'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/organization_object'
    servers:
    - url: https://api.proof.com
      description: Public API URL
  /v1/partners/{id}:
    patch:
      summary: Update Partner Organization
      tags:
      - Organizations
      operationId: updatePartnerOrganization
      security:
      - api_key: []
      parameters:
      - name: id
        in: path
        description: The ID of the partner organization to be updated.
        required: true
        x-example: orzd734dr
        schema:
          type: string
      responses:
        '200':
          description: success
          content:
            application/json:
              example:
                id: or_zd734dr
                name: Batz-Donnelly
                email: bfcec17a0b_alison_reichert@rippin.test
                logo_s3_link: https://notarize-dev-organization-logos.s3.amazonaws.com/743006d598bab1826eaa
              schema:
                $ref: '#/components/schemas/organization_object'
        '400':
          description: bad request
          content:
            application/json:
              example:
                errors:
                - Invalid logo_image format. Must be a valid URL, base64 encoded string, or empty string
              schema:
                $ref: '#/components/schemas/errors_object'
      requestBody:
