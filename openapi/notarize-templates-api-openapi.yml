    servers:
    - url: https://api.proof.com
      description: Public API URL
components:
  schemas:
    errors_object:
      type: object
      properties:
        message:
          type: string
          maxLength: 5000
          description: Deprecated; prefer using the errors array instead
        errors:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          - type: object
    template_object:
      type: object
      properties:
        id:
          type: string
          maxLength: 5000
        created_at:
          type: string
          format: date-time
          maxLength: 100
        updated_at:
          type: string
          format: date-time
          maxLength: 100
        permalink:
          type: string
          maxLength: 5000
        name:
          type: string
          maxLength: 5000
    template_objects:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/template_object'
        total_count:
          type: integer
          description: Total number of templates.
  securitySchemes:
    api_key:
      type: apiKey
      name: ApiKey
      in: header
