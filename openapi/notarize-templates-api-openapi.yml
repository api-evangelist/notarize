paths:
  /v1/templates:
    get:
      summary: List Templates
      tags:
      - Templates
      operationId: getAllTemplates
      security:
      - api_key: []
      parameters:
      - name: limit
        in: query
        description: How many results to return. Default is 100; max is 1000.
        x-example: 2
        schema:
          type: integer
      - name: offset
        in: query
        description: 'Offset request by given # of items. Default is 0.'
        x-example: 1
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                total_count: 3
                templates:
                - id: od6rn64nq
                  created_at: '2026-10-13T16:08:07.317Z'
                  updated_at: '2026-10-13T16:08:07.317Z'
                  permalink: show_test
                  name: Test Template
                - id: odxynqone
                  created_at: '2026-10-13T16:08:07.417Z'
                  updated_at: '2026-10-13T16:08:07.417Z'
                  permalink: second_test
                  name: Test Template
              schema:
                $ref: '#/components/schemas/template_objects'
        '400':
          description: errors for limit out of range
          content:
            application/json:
              example:
                errors:
                  request:
                  - invalid request parameters
              schema:
                $ref: '#/components/schemas/errors_object'
    servers:
    - url: https://api.proof.com
      description: Public API URL
  /mortgage/v2/templates:
    get:
      summary: List Templates
      tags:
      - Templates
      operationId: getAllRealEstateTemplates
      security:
      - api_key: []
      parameters:
      - name: limit
        in: query
        description: How many results to return. Default is 100; max is 1000.
        x-example: 2
        schema:
          type: integer
      - name: offset
        in: query
        description: 'Offset request by given # of items. Default is 0.'
        x-example: 0
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                total_count: 2
                templates:
                - id: od8znm4da
                  created_at: '2026-10-13T16:08:44.246Z'
                  updated_at: '2026-10-13T16:08:44.246Z'
                  permalink: title_one
                  name: Test Template
                - id: odyxdwjng
                  created_at: '2026-10-13T16:08:44.341Z'
                  updated_at: '2026-10-13T16:08:44.341Z'
                  permalink: title_two
                  name: Test Template
              schema:
                $ref: '#/components/schemas/template_objects'
        '400':
          description: errors for limit out of range
