openapi: 3.2.0
info:
  title: Proof Business API Specification Integrations API
  version: v1
servers:
- url: https://api.proof.com
  description: Public API URL
tags:
- name: Integrations
paths:
  /v1/integrations:
    post:
      summary: Create Integration
      tags:
      - Integrations
      operationId: createIntegration
      security:
      - api_key: []
      parameters: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                transaction_types:
                - NOTARIZE_NETWORK
                - COLLECT
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                errors:
                - 'Invalid adobe url: random'
              schema:
                $ref: '#/components/schemas/errors_object'
        '404':
          description: Organization Not Found
          content:
            application/json:
              example:
                errors:
                - 'Not Found: Organization'
              schema:
                $ref: '#/components/schemas/errors_object'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/integration_params'
components:
  schemas:
    integration_params:
      type: object
      properties:
        name:
          type: string
          enum:
          - ADOBE
          - DOCUTECH
          description: Name of Integration
        organization_id:
          type: string
          maxLength: 5000
          description: Organization to create integration for.
        configuration:
          type: object
          properties:
            account_id:
              type: string
              maxLength: 5000
              description: Integration Account
            environment:
              type: string
              maxLength: 5000
              description: Integration Environment
      example:
        name: ADOBE
        configuration:
          account_id: '1234'
          environment: echosigndemo.com
    errors_object:
      type: object
      properties:
        message:
          type: string
          maxLength: 5000
          description: Deprecated; prefer using the errors array instead
        errors:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          - type: object
  securitySchemes:
    api_key:
      type: apiKey
      name: ApiKey
      in: header
