openapi: 3.2.0
info:
  title: Notarize Webhooks API
  version: '1.0'
  description: 'Operations tagged Webhooks across 2 of this provider''s published API definitions: notarize-proof-business-api-specification-openapi.yml, notarize-proof-real-estate-api-specification-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.proof.com
  description: Public API URL
tags:
- name: Webhooks
paths:
  /v1/webhook_tests:
    post:
      summary: Create Webhook Test
      tags:
      - Webhooks
      operationId: createTestWebhook
      security:
      - api_key: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
              schema:
                $ref: '#/components/schemas/webhook_test_object'
        '404':
          description: Not Found
          content:
            application/json:
              example:
                error: Missing Webhook
              schema:
                $ref: '#/components/schemas/webhook_tests_error_object'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example:
                error: Webhook call failed with Exception from WebMock on https://webhook.site/c043db1a-ba1b-47a9-a373-18ceb6e2bb66
              schema:
                $ref: '#/components/schemas/webhook_tests_error_object'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhook_test_object'
    servers:
    - url: https://api.proof.com
      description: Public API URL
  /v1/webhooks:
    get:
      summary: Retrieve Webhook URL
      tags:
      - Webhooks
      operationId: getWebhookURL
      security:
      - api_key: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                url: https://webhook.proof.com
                header: ''
              schema:
                $ref: '#/components/schemas/webhook_object'
        '404':
          description: not_found
          content:
            application/json:
              example:
                errors:
                  request: resource not found
    post:
      summary: Set/Update Webhook URL
      tags:
      - Webhooks
      operationId: createWebhookURL
      security:
      - api_key: []
      parameters: []
      responses:
        '200':
          description: success
          content:
            application/json:
              example:
                url: http://www.google.com
                header: ''
              schema:
                $ref: '#/components/schemas/webhook_object'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                errors:
                  request:
                  - Invalid URL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhook_object'
        description: Notarize will make a POST request to this URL for every transaction status change
    delete:
      summary: Delete Webhook URL
      tags:
      - Webhooks
      operationId: deleteWebhookURL
      security:
      - api_key: []
      responses:
        '200':
          description: successful
        '404':
          description: Not Found
    servers:
    - url: https://api.proof.com
      description: Public API URL
  /v2/webhooks:
    get:
      summary: List Webhook V2
      tags:
      - Webhooks
      operationId: getAllWebhooksV2
      security:
      - api_key: []
      responses:
        '200':
          description: Webhooks retrieved
          content:
            application/json:
              example:
              - url: https://webhook.proof.com
                header: ''
                request_id_header_name: X-Request-Id
                request_id_header_value_template: null
                headers: []
                subscriptions:
                - notary.*
                enabled: true
                id: wh8znm4da
