components:
  schemas:
    webhook_v2_object:
      description: An object representing a Webhook V2.
      type: object
      properties:
        id:
          description: The ID of the Webhook V2 object.
          maxLength: 5000
          type: string
        url:
          description: Proof will make a POST request to this URL for every subscribed event.
          maxLength: 5000
          type: string
        header:
          description: 'A header value to pass through every request Proof makes back to your webhook URL.

            This can be required authentication to your system for security purposes. (E.g. "header": "X-Custom-Header:X-Custom-Key")'
          maxLength: 5000
          type:
          - string
          - 'null'
        headers:
          description: 'A list of header values to pass through every request Proof makes back to your webhook URL.

            This can be required authentication to your system for security purposes. (E.g. "headers": ["[X-Custom-Header]:[X-Custom-Key]"])'
          type: array
          items:
            type: string
            maxLength: 5000
        enabled:
          type: boolean
          description: A boolean value to indicate if the webhook is active.
        request_id_header_name:
          type: string
          description: The name of the header that will contain the request ID for each webhook request. Defaults to X-Request-Id.
        request_id_header_value_template:
          type:
          - string
          - 'null'
        oauth:
          type: object
          properties:
            enabled:
              type: boolean
            token_url:
              type:
              - string
              - 'null'
            client_id:
              type:
              - string
              - 'null'
        subscriptions:
          $ref: '#/components/schemas/webhook_v2_subscriptions'
      required:
      - id
      - url
      - enabled
      - subscriptions
    webhook_v2_subscriptions:
      description: 'An array containing the desired events that Proof should POST a webhook for.

        See our [Webhooks V2 guide](https://dev.proof.com/docs/webhooks-v2) for a list of valid subscriptions.'
      type: array
      items:
        type: string
        enum:
        - '*'
        - transaction.*
        - transaction.created
        - transaction.sent
        - transaction.updated
        - transaction.received
        - transaction.completed
        - transaction.completed_with_rejections
        - transaction.partially_completed
        - transaction.deleted
        - transaction.recalled
        - transaction.canceled
        - transaction.expired
        - transaction.released
        - transaction.held_for_review
        - transaction.declined
        - transaction.reviewed
        - transaction.sent_to_closing_ops
        - transaction.sent_to_signer
        - transaction.sent_to_title_agency
        - transaction.document.upload
        - transaction.document.processed
        - transaction.import.processed
        - transaction.import.failed
        - transaction.meeting.created
        - transaction.meeting.failed
        - transaction.meeting.requested
        - transaction.meeting.video.processed
        - transaction.notary.assigned
        - transaction.signer.kba_failed
        - transaction.signer.kba_passed
        - transaction.signer.high_risk_detected
        - transaction.signer.medium_risk_detected
        - transaction.transaction.automated_identity_verification_by_idv_service_failed
        - transaction.transaction.automated_identity_verification_by_idv_service_passed
        - transaction.underwriter.not_available
        - notary.*
        - notary.created
        - notary.needs_review
        - notary.compliant
        - notary.non_compliant
